name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (CPU wheels, locked)
        run: uv sync --locked --extra deep --extra serve --extra copilot --extra dev
      - name: Lint
        run: uv run ruff check src app tests kaggle
      - name: Tests (synthetic data, no network, no GPU)
        run: uv run pytest
      - name: Result tables are internally consistent
        run: uv run python -m gridcast.experiments.check_results
