name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (CPU wheels, locked)
        run: uv sync --locked --extra deep --extra serve --extra copilot --extra dev --extra physics
      - name: Lint
        run: uv run ruff check src app tests experiments scripts
      - name: Tests (synthetic data, no network, no GPU)
        env:
          GRIDCAST_JOBS: "2"
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: |
          uv run pytest --ignore=tests/test_deep.py
          uv run pytest tests/test_deep.py
      - name: Result tables are internally consistent
        run: uv run python -m gridcast.experiments.check_results
