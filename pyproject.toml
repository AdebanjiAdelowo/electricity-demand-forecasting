[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridcast"
version = "0.1.0"
description = "Reproducible electricity demand forecasting study for ERCOT with probabilistic evaluation, anomaly analysis and a tool-grounded analytical copilot"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Adebanji Adelowo" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14.2",
    "lightgbm>=4.3",
    "holidays>=0.50",
    "pyyaml>=6",
    "requests>=2.31",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
foundation = ["chronos-forecasting>=1.5"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.33", "httpx>=0.27"]
copilot = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
gridcast = "gridcast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gridcast"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs the processed dataset or torch"]
